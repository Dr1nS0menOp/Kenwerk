# SPDX-License-Identifier: Apache-2.0
# Kenwerk on AWS (spec 099): ECS on Fargate, RDS for PostgreSQL 16 on private subnets, EFS for
# the stored files and the backups, an Application Load Balancer, and CloudFront for https on
# its own address unless you bring a domain and a certificate. See docs/operations/deploy-aws.md.
#
#   aws cloudformation deploy --stack-name kenwerk --template-file deploy/aws/kenwerk.yaml \
#     --capabilities CAPABILITY_IAM --parameter-overrides KenwerkVersion=v0.1.0
#
# No secret is in this file: Secrets Manager generates every password and the backup key.
AWSTemplateFormatVersion: "2010-09-09"
Description: Kenwerk, a self-hosted wiki, on ECS Fargate with RDS for PostgreSQL (spec 099).

Parameters:
  KenwerkVersion:
    Description: A released version of Kenwerk, such as v0.1.0. Its images must be published and public.
    Type: String
    AllowedPattern: ^v[0-9]+\.[0-9]+\.[0-9]+$
  ImageRegistry:
    Description: Where the images are, ghcr.io/<owner> of the repository that released them.
    Type: String
    Default: ghcr.io/dr1ns0menop
  DomainName:
    Description: Optional. Your host name, such as wiki.example.com, with CertificateArn. Empty = an address of CloudFront.
    Type: String
    Default: ""
  CertificateArn:
    Description: Optional. An ACM certificate for DomainName, in this region.
    Type: String
    Default: ""
  DatabaseInstanceClass:
    Description: Machine of the database. db.t4g.micro suits a trial; give a few hundred people db.m7g.large.
    Type: String
    Default: db.t4g.micro
  DatabaseBackupDays:
    Description: Days RDS keeps its own backups, to restore to any minute in them.
    Type: Number
    Default: 7
    MinValue: 1
    MaxValue: 35

Conditions:
  UseOwnDomain: !And
    - !Not [!Equals [!Ref DomainName, ""]]
    - !Not [!Equals [!Ref CertificateArn, ""]]
  UseCloudFront: !Not [!Condition UseOwnDomain]

Resources:
  # --- Network: two public subnets for the load balancer and the task, two private ones for
  # the database, which has no way to the internet.
  Vpc:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.30.0.0/16
      EnableDnsHostnames: true
      EnableDnsSupport: true
      Tags: [{ Key: Name, Value: !Ref AWS::StackName }]
  InternetGateway:
    Type: AWS::EC2::InternetGateway
  GatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref Vpc
      InternetGatewayId: !Ref InternetGateway
  PublicSubnetA:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: 10.30.0.0/24
      AvailabilityZone: !Select [0, !GetAZs ""]
  PublicSubnetB:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: 10.30.1.0/24
      AvailabilityZone: !Select [1, !GetAZs ""]
  PrivateSubnetA:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: 10.30.10.0/24
      AvailabilityZone: !Select [0, !GetAZs ""]
  PrivateSubnetB:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: 10.30.11.0/24
      AvailabilityZone: !Select [1, !GetAZs ""]
  PublicRoutes:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref Vpc
  PublicDefaultRoute:
    Type: AWS::EC2::Route
    DependsOn: GatewayAttachment
    Properties:
      RouteTableId: !Ref PublicRoutes
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway
  PublicSubnetARoutes:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnetA
      RouteTableId: !Ref PublicRoutes
  PublicSubnetBRoutes:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnetB
      RouteTableId: !Ref PublicRoutes
  PrivateRoutes:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref Vpc
  PrivateSubnetARoutes:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PrivateSubnetA
      RouteTableId: !Ref PrivateRoutes
  PrivateSubnetBRoutes:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PrivateSubnetB
      RouteTableId: !Ref PrivateRoutes

  # With CloudFront, the load balancer is internal and only CloudFront's VPC origin, inside
  # this network, reaches it. With your own domain it faces the internet on 80 and 443.
  LoadBalancerSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Kenwerk load balancer
      VpcId: !Ref Vpc
      SecurityGroupIngress: !If
        - UseOwnDomain
        - - { IpProtocol: tcp, FromPort: 443, ToPort: 443, CidrIp: 0.0.0.0/0, Description: https }
          - { IpProtocol: tcp, FromPort: 80, ToPort: 80, CidrIp: 0.0.0.0/0, Description: redirect to https }
        - - { IpProtocol: tcp, FromPort: 80, ToPort: 80, CidrIp: 10.30.0.0/16, Description: CloudFront VPC origin }
  AppSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Kenwerk task, reached only by the load balancer
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 8080
          ToPort: 8080
          SourceSecurityGroupId: !Ref LoadBalancerSecurityGroup
          Description: the load balancer
  DatabaseSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Kenwerk database, reached only by the task
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 5432
          ToPort: 5432
          SourceSecurityGroupId: !Ref AppSecurityGroup
          Description: the task
  FilesSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Kenwerk files, reached only by the task
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 2049
          ToPort: 2049
          SourceSecurityGroupId: !Ref AppSecurityGroup
          Description: the task

  # --- Secrets, generated here: letters and digits, so each fits an address as it is.
  OwnerSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Description: Kenwerk, the owner of the tables
      GenerateSecretString:
        SecretStringTemplate: '{"username":"kenwerk_owner"}'
        GenerateStringKey: password
        PasswordLength: 40
        ExcludePunctuation: true
  AppSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Description: Kenwerk, the application role
      GenerateSecretString:
        SecretStringTemplate: '{"username":"kenwerk_app"}'
        GenerateStringKey: password
        PasswordLength: 40
        ExcludePunctuation: true
  # Kept when the stack is deleted: without it, no backup can be restored (spec 054).
  BackupKeySecret:
    Type: AWS::SecretsManager::Secret
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Description: Kenwerk, the key of the backups. Keep a copy in a password safe.
      GenerateSecretString:
        PasswordLength: 44
        ExcludePunctuation: true

  # --- Database
  DatabaseSubnets:
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      DBSubnetGroupDescription: Kenwerk database
      SubnetIds: [!Ref PrivateSubnetA, !Ref PrivateSubnetB]
  Database:
    Type: AWS::RDS::DBInstance
    DeletionPolicy: Snapshot
    UpdateReplacePolicy: Snapshot
    Properties:
      Engine: postgres
      # The release a new database starts at; RDS upgrades minor releases in the maintenance
      # window from then on. A bare "16" is refused for new databases.
      EngineVersion: "16.13"
      DBInstanceClass: !Ref DatabaseInstanceClass
      DBName: kenwerk
      MasterUsername: !Sub "{{resolve:secretsmanager:${OwnerSecret}:SecretString:username}}"
      MasterUserPassword: !Sub "{{resolve:secretsmanager:${OwnerSecret}:SecretString:password}}"
      AllocatedStorage: "20"
      MaxAllocatedStorage: 200
      StorageType: gp3
      StorageEncrypted: true
      BackupRetentionPeriod: !Ref DatabaseBackupDays
      CopyTagsToSnapshot: true
      DeletionProtection: true
      PubliclyAccessible: false
      AutoMinorVersionUpgrade: true
      DBSubnetGroupName: !Ref DatabaseSubnets
      VPCSecurityGroups: [!Ref DatabaseSecurityGroup]

  # --- Files: kept when the stack is deleted, because they are the wiki's attachments.
  Files:
    Type: AWS::EFS::FileSystem
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Encrypted: true
      BackupPolicy:
        Status: ENABLED
      FileSystemPolicy:
        Version: "2012-10-17"
        Statement:
          - Effect: Deny
            Principal: { AWS: "*" }
            Action: "*"
            Condition:
              Bool: { aws:SecureTransport: "false" }
  FilesMountA:
    Type: AWS::EFS::MountTarget
    Properties:
      FileSystemId: !Ref Files
      SubnetId: !Ref PublicSubnetA
      SecurityGroups: [!Ref FilesSecurityGroup]
  FilesMountB:
    Type: AWS::EFS::MountTarget
    Properties:
      FileSystemId: !Ref Files
      SubnetId: !Ref PublicSubnetB
      SecurityGroups: [!Ref FilesSecurityGroup]
  # The data volume of compose.yaml: stored files, master.key and the queue, all as the user
  # the server runs as. The backup service reads it through the same door.
  DataAccessPoint:
    Type: AWS::EFS::AccessPoint
    Properties:
      FileSystemId: !Ref Files
      PosixUser: { Uid: "65532", Gid: "65532" }
      RootDirectory:
        Path: /data
        CreationInfo: { OwnerUid: "65532", OwnerGid: "65532", Permissions: "0700" }
  BackupsAccessPoint:
    Type: AWS::EFS::AccessPoint
    Properties:
      FileSystemId: !Ref Files
      PosixUser: { Uid: "0", Gid: "0" }
      RootDirectory:
        Path: /backups
        CreationInfo: { OwnerUid: "0", OwnerGid: "0", Permissions: "0700" }

  # --- The app
  Logs:
    Type: AWS::Logs::LogGroup
    Properties:
      RetentionInDays: 30
  Cluster:
    Type: AWS::ECS::Cluster
  ExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: ecs-tasks.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Sub arn:${AWS::Partition}:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy
      Policies:
        - PolicyName: read-the-secrets
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource: [!Ref OwnerSecret, !Ref AppSecret, !Ref BackupKeySecret]
  TaskRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: ecs-tasks.amazonaws.com }
            Action: sts:AssumeRole
      Policies:
        - PolicyName: files
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: [elasticfilesystem:ClientMount, elasticfilesystem:ClientWrite]
                Resource: !GetAtt Files.Arn
        # aws ecs execute-command, for kenwerk setup-code and kenwerk backup note.
        - PolicyName: execute-command
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - ssmmessages:CreateControlChannel
                  - ssmmessages:CreateDataChannel
                  - ssmmessages:OpenControlChannel
                  - ssmmessages:OpenDataChannel
                Resource: "*"

  Task:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: !Ref AWS::StackName
      RequiresCompatibilities: [FARGATE]
      NetworkMode: awsvpc
      Cpu: "1024"
      Memory: "2048"
      RuntimePlatform:
        OperatingSystemFamily: LINUX
        CpuArchitecture: ARM64
      ExecutionRoleArn: !GetAtt ExecutionRole.Arn
      TaskRoleArn: !GetAtt TaskRole.Arn
      Volumes:
        - Name: data
          EFSVolumeConfiguration:
            FilesystemId: !Ref Files
            TransitEncryption: ENABLED
            AuthorizationConfig: { AccessPointId: !Ref DataAccessPoint, IAM: ENABLED }
        - Name: backups
          EFSVolumeConfiguration:
            FilesystemId: !Ref Files
            TransitEncryption: ENABLED
            AuthorizationConfig: { AccessPointId: !Ref BackupsAccessPoint, IAM: ENABLED }
        # Task-local folders: the secrets as the files each container reads, the backup key,
        # an empty /secrets for the backup to pack, and /tmp for the read-only server.
        - Name: app-secrets
        - Name: owner-secrets
        - Name: key
        - Name: no-secret-files
        - Name: tmp
      ContainerDefinitions:
        # Writes the secret files, then makes the application role (spec 099). The database
        # is reached over TLS without checking its certificate: RDS signs with its own CA,
        # which the images do not carry, and the network is this stack's own (spec 099, D7).
        - Name: prepare
          Image: !Sub ${ImageRegistry}/kenwerk-backup:${KenwerkVersion}
          Essential: false
          EntryPoint: [bash, -c]
          Command:
            - >-
              set -eu; umask 077;
              q='sslmode=require';
              printf 'postgres://kenwerk_app:%s@%s:5432/kenwerk?%s' "$APP_PASSWORD" "$DB_HOST" "$q" >/app-secrets/database_url;
              cp /app-secrets/database_url /owner-secrets/database_url;
              printf 'postgres://kenwerk_owner:%s@%s:5432/kenwerk?%s' "$OWNER_PASSWORD" "$DB_HOST" "$q" >/owner-secrets/migrate_database_url;
              printf '%s\n' "$BACKUP_KEY" >/key/backup.key;
              chmod 755 /app-secrets; chmod 644 /app-secrets/database_url;
              exec bash /usr/local/bin/kenwerk-backup app-role
          Environment:
            - { Name: DB_HOST, Value: !GetAtt Database.Endpoint.Address }
            - { Name: KENWERK_DATABASE_URL_FILE, Value: /owner-secrets/database_url }
            - { Name: KENWERK_MIGRATE_DATABASE_URL_FILE, Value: /owner-secrets/migrate_database_url }
          Secrets:
            - { Name: OWNER_PASSWORD, ValueFrom: !Sub "${OwnerSecret}:password::" }
            - { Name: APP_PASSWORD, ValueFrom: !Sub "${AppSecret}:password::" }
            - { Name: BACKUP_KEY, ValueFrom: !Ref BackupKeySecret }
          MountPoints:
            - { SourceVolume: app-secrets, ContainerPath: /app-secrets }
            - { SourceVolume: owner-secrets, ContainerPath: /owner-secrets }
            - { SourceVolume: key, ContainerPath: /key }
          LogConfiguration:
            LogDriver: awslogs
            Options: { awslogs-group: !Ref Logs, awslogs-region: !Ref AWS::Region, awslogs-stream-prefix: kenwerk }
        - Name: kenwerk
          Image: !Sub ${ImageRegistry}/kenwerk:${KenwerkVersion}
          Essential: true
          User: "65532:65532"
          ReadonlyRootFilesystem: true
          DependsOn:
            - { ContainerName: prepare, Condition: SUCCESS }
          PortMappings:
            - { ContainerPort: 8080, Protocol: tcp }
          Environment:
            - { Name: KENWERK_ROLE, Value: all }
            - Name: KENWERK_PUBLIC_URL
              Value: !If
                - UseOwnDomain
                - !Sub https://${DomainName}
                - !Sub https://${Distribution.DomainName}
            # The server holds only the application role; the backup service migrates
            # (spec 070), and the server waits on its page until it did.
            - { Name: KENWERK_DATABASE_URL_FILE, Value: /run/secrets/kenwerk/database_url }
            - { Name: KENWERK_MIGRATE_ON_START, Value: "false" }
            # Only the load balancer, and CloudFront's VPC origin, in this network reach the task.
            - { Name: KENWERK_TRUSTED_PROXIES, Value: 10.30.0.0/16 }
          MountPoints:
            - { SourceVolume: data, ContainerPath: /var/lib/kenwerk }
            - { SourceVolume: app-secrets, ContainerPath: /run/secrets/kenwerk, ReadOnly: true }
            - { SourceVolume: tmp, ContainerPath: /tmp }
          HealthCheck:
            Command: [CMD, /usr/local/bin/kenwerk, healthcheck]
            Interval: 15
            Timeout: 5
            Retries: 3
            StartPeriod: 120
          LogConfiguration:
            LogDriver: awslogs
            Options: { awslogs-group: !Ref Logs, awslogs-region: !Ref AWS::Region, awslogs-stream-prefix: kenwerk }
        # The backup service of compose.yaml (spec 054): backups every 4 hours, the migrations
        # of a new release, and the audit checkpoints (spec 070).
        - Name: backup
          Image: !Sub ${ImageRegistry}/kenwerk-backup:${KenwerkVersion}
          Essential: true
          DependsOn:
            - { ContainerName: prepare, Condition: SUCCESS }
          Environment:
            - { Name: KENWERK_DATABASE_URL_FILE, Value: /run/secrets/kenwerk/database_url }
            - { Name: KENWERK_MIGRATE_DATABASE_URL_FILE, Value: /run/secrets/kenwerk/migrate_database_url }
            - { Name: KENWERK_DATA_DIR, Value: /data }
            - { Name: KENWERK_BACKUP_INTERVAL, Value: 4h }
            - { Name: KENWERK_BACKUP_KEEP, Value: "42" }
          MountPoints:
            - { SourceVolume: data, ContainerPath: /data }
            - { SourceVolume: backups, ContainerPath: /backups }
            - { SourceVolume: key, ContainerPath: /key, ReadOnly: true }
            - { SourceVolume: owner-secrets, ContainerPath: /run/secrets/kenwerk, ReadOnly: true }
            - { SourceVolume: no-secret-files, ContainerPath: /secrets }
          LogConfiguration:
            LogDriver: awslogs
            Options: { awslogs-group: !Ref Logs, awslogs-region: !Ref AWS::Region, awslogs-stream-prefix: kenwerk }

  LoadBalancer:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Type: application
      Scheme: !If [UseOwnDomain, internet-facing, internal]
      Subnets: !If
        - UseOwnDomain
        - [!Ref PublicSubnetA, !Ref PublicSubnetB]
        - [!Ref PrivateSubnetA, !Ref PrivateSubnetB]
      SecurityGroups: [!Ref LoadBalancerSecurityGroup]
      LoadBalancerAttributes:
        - { Key: routing.http.drop_invalid_header_fields.enabled, Value: "true" }
  Targets:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      VpcId: !Ref Vpc
      TargetType: ip
      Protocol: HTTP
      Port: 8080
      HealthCheckPath: /readyz
      Matcher: { HttpCode: "200" }
      TargetGroupAttributes:
        - { Key: deregistration_delay.timeout_seconds, Value: "30" }
  HttpsListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Condition: UseOwnDomain
    Properties:
      LoadBalancerArn: !Ref LoadBalancer
      Protocol: HTTPS
      Port: 443
      SslPolicy: ELBSecurityPolicy-TLS13-1-2-2021-06
      Certificates: [{ CertificateArn: !Ref CertificateArn }]
      DefaultActions: [{ Type: forward, TargetGroupArn: !Ref Targets }]
  RedirectListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Condition: UseOwnDomain
    Properties:
      LoadBalancerArn: !Ref LoadBalancer
      Protocol: HTTP
      Port: 80
      DefaultActions:
        - Type: redirect
          RedirectConfig: { Protocol: HTTPS, Port: "443", StatusCode: HTTP_301 }
  OriginListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Condition: UseCloudFront
    Properties:
      LoadBalancerArn: !Ref LoadBalancer
      Protocol: HTTP
      Port: 80
      DefaultActions: [{ Type: forward, TargetGroupArn: !Ref Targets }]

  # CloudFront reaches the internal load balancer through the network of this stack.
  VpcOrigin:
    Type: AWS::CloudFront::VpcOrigin
    Condition: UseCloudFront
    Properties:
      VpcOriginEndpointConfig:
        Name: !Sub ${AWS::StackName}-origin
        Arn: !Ref LoadBalancer
        HTTPPort: 80
        HTTPSPort: 443
        OriginProtocolPolicy: http-only
  Distribution:
    Type: AWS::CloudFront::Distribution
    Condition: UseCloudFront
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: !Sub Kenwerk ${AWS::StackName}
        HttpVersion: http2and3
        PriceClass: PriceClass_100
        ViewerCertificate:
          CloudFrontDefaultCertificate: true
        Origins:
          - Id: kenwerk
            DomainName: !GetAtt LoadBalancer.DNSName
            VpcOriginConfig:
              VpcOriginId: !GetAtt VpcOrigin.Id
              OriginReadTimeout: 60
        DefaultCacheBehavior:
          TargetOriginId: kenwerk
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD, OPTIONS, PUT, PATCH, POST, DELETE]
          CachedMethods: [GET, HEAD]
          Compress: true
          # Managed policies: no caching, and every header, cookie and query string passed on,
          # so CloudFront never serves one person's page to another.
          CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad
          OriginRequestPolicyId: 216adef6-5c7f-47e4-b989-5492eafa07d3

  # The service may only start once a listener ties the targets to the load balancer, and
  # which listener exists depends on the condition; this handle depends on whichever does.
  ListenerReady:
    Type: AWS::CloudFormation::WaitConditionHandle
    Metadata:
      Https: !If [UseOwnDomain, !Ref HttpsListener, ""]
      Origin: !If [UseCloudFront, !Ref OriginListener, ""]

  Service:
    Type: AWS::ECS::Service
    DependsOn: ListenerReady
    Properties:
      Cluster: !Ref Cluster
      LaunchType: FARGATE
      TaskDefinition: !Ref Task
      DesiredCount: 1
      EnableExecuteCommand: true
      HealthCheckGracePeriodSeconds: 300
      # The old task stops before the new one starts: one node, as Kenwerk is sized for, and
      # the embedded queue on the files never has two owners.
      DeploymentConfiguration:
        MinimumHealthyPercent: 0
        MaximumPercent: 100
      NetworkConfiguration:
        AwsvpcConfiguration:
          # A public address only to reach the image registry, mail and the identity provider;
          # the security group lets in nothing but the load balancer.
          AssignPublicIp: ENABLED
          Subnets: [!Ref PublicSubnetA, !Ref PublicSubnetB]
          SecurityGroups: [!Ref AppSecurityGroup]
      LoadBalancers:
        - { ContainerName: kenwerk, ContainerPort: 8080, TargetGroupArn: !Ref Targets }

Outputs:
  Url:
    Description: The address of the wiki. Open /setup there with the code from the log.
    Value: !If [UseOwnDomain, !Sub "https://${DomainName}", !Sub "https://${Distribution.DomainName}"]
  LoadBalancerName:
    Condition: UseOwnDomain
    Description: Point your domain at this name, with a CNAME or an alias record.
    Value: !GetAtt LoadBalancer.DNSName
  SetupCodeCommand:
    Description: Prints the line of the log with the one-time setup code.
    Value: !Sub "aws logs tail ${Logs} --since 1h | grep 'first setup'"
  BackupKeySecret:
    Description: The backup key. Copy it to a password safe.
    Value: !Ref BackupKeySecret
