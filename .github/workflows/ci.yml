# SPDX-License-Identifier: Apache-2.0
# Every gate here must pass before a pull request can be merged.
# Every action is pinned by commit SHA, with its version in a comment; Renovate keeps the
# pins current (see renovate.json).
name: ci

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 3 * * *" # nightly: fuzzing, mutation check and restore drill

permissions:
  contents: read

# The nightly run has a group of its own: a push to main must not cancel it.
concurrency:
  group: ci-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name != 'schedule' }}

jobs:
  dco:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - run: sh scripts/check-dco.sh "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}"

  go:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16@sha256:3950ad7c3148ca2175ef1b6c36c9efbf78957ae8fbe8b3a5d7c35af50500382f
        env:
          POSTGRES_USER: kenwerk
          POSTGRES_PASSWORD: kenwerk
          POSTGRES_DB: kenwerk
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U kenwerk"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      KENWERK_TEST_DATABASE_URL: postgres://kenwerk:kenwerk@localhost:5432/kenwerk?sslmode=disable
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - name: format
        run: make fmt-check
      - name: vet
        run: make vet
      - name: staticcheck
        run: make staticcheck
      - name: vulnerabilities
        run: make vuln
      # Spec 097: complexity, length, copies and security patterns, with the ratchet.
      - name: lint
        run: make lint
      - name: tests (race detector, integration against PostgreSQL)
        # A job log needs a login to read, while annotations are public, so the lines that
        # name a failing test also go out as annotations.
        run: |
          set +e
          make test-race 2>&1 | tee "$RUNNER_TEMP/test-race.log"
          status=${PIPESTATUS[0]}
          grep -E -e '--- FAIL|^FAIL|^panic:|WARNING: DATA RACE|_test\.go:[0-9]+:' "$RUNNER_TEMP/test-race.log" \
            | head -n 40 | sed 's/%/%25/g; s/^/::error::/'
          exit "$status"
      - name: build
        run: make build

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: install
        run: npm ci --no-fund --no-audit
        working-directory: web
      - name: types, lint, translation strings, unit tests
        run: make web-check
      - run: make collab-check
      # Spec 097: every package, development ones too, of the frontend and of the service
      # for editing together. This covers what the shipped-only audit covered before.
      - name: known vulnerabilities in all packages
        run: make audit
      - name: licences
        run: make licenses

  # Spec 097: no secret in any commit of any branch, nor in the working tree.
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - name: every commit
        run: make secrets-history
      - name: the working tree
        run: make secrets

  e2e:
    runs-on: ubuntu-latest
    needs: [go, web]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: start the development containers
        run: bash scripts/dev up
      - name: install frontend packages
        run: bash scripts/dev sh -c "cd web && npm ci --no-fund --no-audit"
      - name: real binary, real PostgreSQL, real Chromium, accessibility checks
        run: bash scripts/e2e
      # A failed picture is judged from its actual, expected and diff images, which only the
      # run that failed has. The repository is public, so this artifact is public too: test
      # results hold only the made-up data of the tests, never a secret.
      - name: keep the test results, when something failed
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-test-results
          path: web/test-results
          if-no-files-found: ignore
          retention-days: 7

  # Spec 099: every way to deploy is checked without a cloud account. The Helm chart with helm
  # lint, helm template and kubeconform, the Terraform module with OpenTofu and Terraform, the
  # Azure template with Bicep, the AWS template with cfn-lint, and the step that makes the
  # application role against PostgreSQL. Each tool is pinned by version and sha256 in the script.
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: deployment templates
        run: bash scripts/deploy-check.sh

  # Blueprint 07, rule 2: the release before keeps serving while this one migrates
  # the same database, and still runs on it afterwards, as a rollback does.
  upgrade:
    runs-on: ubuntu-latest
    needs: go
    services:
      postgres:
        image: postgres:16@sha256:3950ad7c3148ca2175ef1b6c36c9efbf78957ae8fbe8b3a5d7c35af50500382f
        env:
          POSTGRES_USER: kenwerk
          POSTGRES_PASSWORD: kenwerk
          POSTGRES_DB: kenwerk
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U kenwerk"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      KENWERK_TEST_DATABASE_URL: postgres://kenwerk:kenwerk@localhost:5432/kenwerk?sslmode=disable
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - name: release N and N+1 side by side on one database
        env:
          # The target branch of a pull request, or main before this push. Empty on
          # a schedule, and then the script takes the commit before.
          RELEASE_N: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: bash scripts/upgrade-check.sh "$RELEASE_N"

  container:
    runs-on: ubuntu-latest
    needs: go
    services:
      postgres:
        image: postgres:16@sha256:3950ad7c3148ca2175ef1b6c36c9efbf78957ae8fbe8b3a5d7c35af50500382f
        env:
          POSTGRES_USER: kenwerk
          POSTGRES_PASSWORD: kenwerk
          POSTGRES_DB: kenwerk
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U kenwerk"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: build image
        run: docker build -t kenwerk:ci .
      - name: build the image of the backup service (spec 054)
        run: docker build --target backup -t kenwerk-backup:ci .
      - name: build the image of the service for editing together
        run: docker build -t kenwerk-collab:ci collab
      # Every image the reference installation runs is scanned, not only the app (spec 067).
      - name: scan the app image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: kenwerk:ci
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true
      - name: scan the backup image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: kenwerk-backup:ci
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true
      - name: scan the image of the service for editing together
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: kenwerk-collab:ci
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true
      # ADR-038: a ZAP baseline against the real image, as a browser would reach it.
      - name: start the image for ZAP
        run: |
          docker run -d --name kenwerk --network host \
            -e KENWERK_DATABASE_URL='postgres://kenwerk:kenwerk@localhost:5432/kenwerk?sslmode=disable' \
            -e KENWERK_PUBLIC_URL=http://localhost:8080 kenwerk:ci
          for _ in $(seq 1 60); do curl -sf http://localhost:8080/readyz >/dev/null && break; sleep 1; done
          curl -sf http://localhost:8080/readyz
      - name: ZAP baseline
        uses: zaproxy/action-baseline@de8ad967d3548d44ef623df22cf95c3b0baf8b25 # v0.15.0
        with:
          target: http://localhost:8080
          rules_file_name: .zap/rules.tsv
          cmd_options: -a
          fail_action: true
          allow_issue_writing: false
      - name: server log, when something failed
        if: failure()
        run: docker logs kenwerk 2>&1 | tail -50

  # ADR-038: Semgrep's rules for Go, TypeScript, React and secrets. A finding fails the
  # build; an exception is a nosemgrep comment on the line, with the reason above it.
  semgrep:
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep:1.186.0@sha256:6e1b04340e60e910fbb4ddbf3c857ab0918f064417ad5ac530014ccb3cf8c8f1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: scan
        run: >-
          semgrep scan --metrics=off --error
          --config p/golang --config p/typescript --config p/react --config p/secrets
          --exclude internal/webui/dist

  # ADR-038: CodeQL with its extended security queries. A finding fails the build.
  codeql:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: go
            build-mode: autobuild
            pack: go
          - language: javascript-typescript
            build-mode: none
            pack: javascript
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        if: matrix.language == 'go'
        with:
          go-version-file: go.mod
      - uses: github/codeql-action/init@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          queries: security-extended
          # The suppression query turns a codeql[rule] comment above a line into a suppression.
          # A query inside a pack is named through packs; queries only takes suites and paths.
          packs: codeql/${{ matrix.pack }}-queries:AlertSuppression.ql
      - uses: github/codeql-action/analyze@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          category: /language:${{ matrix.language }}
          output: codeql-results
          # A pull request from a fork may not write to code scanning; the check below still runs.
          upload: ${{ github.event.pull_request.head.repo.fork && 'never' || 'always' }}
      # A result counts unless a `codeql[rule]` comment above its line, with the reason, suppresses it.
      - name: no findings
        run: |
          open='.runs[].results[] | select((.suppressions // []) | length == 0)'
          found=$(jq "[$open] | length" codeql-results/*.sarif | awk '{s+=$1} END {print s+0}')
          if [ "$found" -gt 0 ]; then
            jq -r "$open"' | "\(.ruleId): \(.locations[0].physicalLocation.artifactLocation.uri):\(.locations[0].physicalLocation.region.startLine) \(.message.text)"' codeql-results/*.sarif
            echo "CodeQL found $found problem(s)"
            exit 1
          fi

  # Spec 057: a release still builds, installs and reproduces. Not on pull requests, so a
  # review is not held up by it (D5); on main after every push, and at night.
  release-dry-run:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    needs: go
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: the binary and the web assets reproduce
        run: bash scripts/reproducible.sh
      - name: web assets, embedded in the binary
        run: npm ci --no-fund --no-audit && npx vite build
        working-directory: web
      - name: the release configuration is valid
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          distribution: goreleaser
          version: v2.20.3
          args: check
      - name: archives and packages, twice
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          distribution: goreleaser
          version: v2.20.3
          args: release --snapshot --clean --skip=sign,sbom
      # Outside the checkout: Go stamps the binary with vcs.modified=true when any untracked
      # file sits in the tree, so a copy kept inside made the second build differ (spec 065).
      - name: keep the first run
        run: mv dist "$RUNNER_TEMP/dist-first"
      - name: the checkout is clean, as a release builds from it
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git status --porcelain | while IFS= read -r line; do echo "::error title=not clean::$line"; done
            exit 1
          fi
      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          distribution: goreleaser
          version: v2.20.3
          args: release --snapshot --clean --skip=sign,sbom
      # A difference becomes an annotation naming the file and, for a binary, the build
      # settings Go recorded in it, so the cause can be read from the run itself.
      - name: the two runs are the same, byte for byte
        run: |
          first="$RUNNER_TEMP/dist-first"
          if diff "$first/checksums.txt" dist/checksums.txt >checksums.diff; then exit 0; fi
          grep -E '^[<>]' checksums.diff | while IFS= read -r line; do
            echo "::error title=not reproducible::$line"
          done || true
          for f in $(grep -E '^<' checksums.diff | awk '{print $3}'); do
            case "$f" in
              *.tar.gz)
                mkdir -p "$RUNNER_TEMP/a" "$RUNNER_TEMP/b"
                tar -xzf "$first/$f" -C "$RUNNER_TEMP/a" kenwerk && tar -xzf "dist/$f" -C "$RUNNER_TEMP/b" kenwerk &&
                  diff <(go version -m "$RUNNER_TEMP/a/kenwerk") <(go version -m "$RUNNER_TEMP/b/kenwerk") | head -8 |
                  while IFS= read -r line; do echo "::error title=$f::$line"; done || true
                rm -rf "$RUNNER_TEMP/a" "$RUNNER_TEMP/b" ;;
            esac
          done
          exit 1
      - name: the .deb installs on Debian and the .rpm on Fedora
        run: |
          docker run --rm -v "$PWD/dist:/dist:ro" debian:12 sh -c \
            'dpkg -i /dist/*_amd64.deb && id kenwerk && test -d /var/lib/kenwerk && kenwerk version'
          docker run --rm -v "$PWD/dist:/dist:ro" fedora:41 sh -c \
            'rpm -i /dist/*_amd64.rpm && id kenwerk && test -d /var/lib/kenwerk && kenwerk version'

  nightly:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16@sha256:3950ad7c3148ca2175ef1b6c36c9efbf78957ae8fbe8b3a5d7c35af50500382f
        env:
          POSTGRES_USER: kenwerk
          POSTGRES_PASSWORD: kenwerk
          POSTGRES_DB: kenwerk
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U kenwerk"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      KENWERK_TEST_DATABASE_URL: postgres://kenwerk:kenwerk@localhost:5432/kenwerk?sslmode=disable
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: fuzz the parsers
        run: make fuzz
      # Nine mutations break frontend rules, and their tests need the web dependencies.
      - name: web dependencies
        run: npm ci --no-fund --no-audit
        working-directory: web
      # Mutations of the service for editing together run its own tests.
      - name: collab dependencies
        run: npm ci --no-fund --no-audit
        working-directory: collab
      # Every mutation that is not caught becomes an annotation, readable without the log.
      - name: do the tests catch injected bugs?
        run: |
          # The step shell stops at the first failure, so the status is kept instead.
          status=0
          make mutation 2>&1 | tee mutation.txt || status=$?
          grep -vE '^(caught|running|all mutations)' mutation.txt | grep -E '^[A-Z]+ ' | head -40 |
            while IFS= read -r line; do echo "::error title=mutation::$line"; done || true
          tail -1 mutation.txt
          exit "$status"
      # Spec 097: Stryker on the frontend logic; no file's score may fall below its floor.
      # Nightly, as the Go mutation check: a full run takes over half an hour.
      - name: do the frontend tests catch changed code?
        run: make mutation-web
      - name: can an encrypted backup be restored on a clean installation?
        run: bash scripts/restore-drill.sh
