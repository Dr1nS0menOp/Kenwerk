# SPDX-License-Identifier: Apache-2.0
# The image of the helper for PDF files and office previews (deploy/pdf). It carries Chromium
# and LibreOffice, which read hostile files, so each build takes Debian's newest security
# updates. It runs at every release, and by hand. Each build is scanned first and published
# only when Trivy finds no fixable HIGH or CRITICAL problem, then signed keylessly with
# Sigstore and attested, as the images of release.yml. Tags: the release (vX.Y.Z), or the
# date of a build by hand (YYYY-MM-DD), and `current` for the newest. Every action is pinned
# by commit SHA. A weekly build waits for the product owner's decision.
name: pdf-image

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]
  workflow_dispatch:

permissions: {}

concurrency:
  group: pdf-image
  cancel-in-progress: false

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # the image on ghcr.io
      id-token: write # keyless signing and attestations
      attestations: write
    env:
      COSIGN_VERSION: v3.1.4
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # A release comes from main only, as in release.yml.
      - name: the tag is on main
        if: github.ref_type == 'tag'
        run: |
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main ||
            { echo "::error::$GITHUB_REF_NAME is not on main"; exit 1; }

      - name: owner of the image, and its tag
        run: |
          echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/kenwerk-pdf" >> "$GITHUB_ENV"
          if [ "$GITHUB_REF_TYPE" = tag ]; then tag=$GITHUB_REF_NAME; else tag=$(date -u +%F); fi
          echo "IMAGE_TAG=$tag" >> "$GITHUB_ENV"

      - uses: sigstore/cosign-installer@881c63bd87e38389154debd8331404ce7ca8a3ab # v4.1.4
        with:
          cosign-release: ${{ env.COSIGN_VERSION }}
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # Scanned before anything is published.
      - name: build for the scan
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: deploy/pdf
          platforms: linux/amd64
          pull: true
          no-cache: true
          load: true
          tags: kenwerk-pdf:scan
      - name: scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: kenwerk-pdf:scan
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true

      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: deploy/pdf
          platforms: linux/amd64,linux/arm64
          pull: true
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ env.IMAGE_TAG }}
            ${{ env.IMAGE }}:current
          sbom: true
          provenance: mode=max
      - name: sign the image
        run: cosign sign --yes "${IMAGE}@${DIGEST}"
        env:
          DIGEST: ${{ steps.image.outputs.digest }}
      - name: provenance of the image
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.image.outputs.digest }}
          push-to-registry: true
      - name: the digest to pin
        run: echo "::notice title=kenwerk-pdf::${IMAGE}:${IMAGE_TAG}@${DIGEST}"
        env:
          DIGEST: ${{ steps.image.outputs.digest }}
